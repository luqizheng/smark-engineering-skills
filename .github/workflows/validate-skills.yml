name: Validate Skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skill structure and local references
        run: python scripts/validate_skill.py
      - name: Test non-negotiable skill contract
        run: python -m unittest discover -s tests -v
